name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4

      # Template-ul gol (fără package.json) nu are ce verifica — CI trece (skip).
      # După `create-next-app` (vezi SETUP.md) toți pașii rulează normal.
      - name: Check bootstrap
        id: bootstrap
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Niciun package.json (template gol) — sar peste CI până la bootstrap (vezi SETUP.md)."
          fi

      - uses: actions/setup-node@v4
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.bootstrap.outputs.ready == 'true'
        run: npm ci
      - if: steps.bootstrap.outputs.ready == 'true'
        run: npx prisma generate
      - if: steps.bootstrap.outputs.ready == 'true'
        run: npm run typecheck
      - if: steps.bootstrap.outputs.ready == 'true'
        run: npm test
      - if: steps.bootstrap.outputs.ready == 'true'
        run: npx playwright install --with-deps
      - if: steps.bootstrap.outputs.ready == 'true'
        run: npm run test:e2e
